<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canto">
<title>Canto · treino vocal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="app">
  <header class="top pad">
    <div class="brand">
      <span class="eyebrow">Alex · Claude</span>
      <h1 id="viewTitle">Treinar</h1>
    </div>
    <button class="range-chip" id="rangeChip" aria-label="Sua extensão de trabalho">
      <small>Extensão</small><b id="rangeTxt">—</b>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </header>

  <main class="views">
    <section class="view pad" id="v-train" aria-label="Treinar"></section>
    <section class="view pad" id="v-tuner" aria-label="Afinador" hidden></section>
    <section class="view pad" id="v-progress" aria-label="Progresso" hidden></section>
    <section class="view pad" id="v-guide" aria-label="Guia" hidden></section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="train" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Treinar</button>
    <button class="tab" role="tab" data-view="tuner" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg>Afinador</button>
    <button class="tab" role="tab" data-view="progress" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progresso</button>
    <button class="tab" role="tab" data-view="guide" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13M9 7h6M9 11h4"/></svg>Guia</button>
  </nav>
</div>

<div class="overlay" id="ov" hidden>
  <div class="pad">
    <div class="ov-head">
      <div class="t"><span class="eyebrow" id="ovEyebrow"></span><b id="ovTitle"></b></div>
      <button class="icon-btn" id="ovCar" aria-label="Alternar modo carro"><svg viewBox="0 0 24 24"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-6h12l2 6v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg></button>
      <button class="icon-btn" id="ovClose" aria-label="Encerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="blocks" id="ovBlocks"></div>
  </div>
  <div class="ov-body pad" id="ovBody"></div>
  <div class="ov-ctrl pad" id="ovCtrl"></div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="text-btn" id="sheetClose">Fechar</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
